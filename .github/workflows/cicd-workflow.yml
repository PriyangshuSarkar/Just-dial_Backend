name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest # No need for brackets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{secrets.DOCKER_PASSWORD}}"

      - name: Build and Push Docker Image
        run: |
          docker build -t spritegenix/cyber-sec-backend:latest .
          docker push spritegenix/cyber-sec-backend:latest

  deploy:
    needs: build
    runs-on: ip-172-31-13-35 # No brackets
    steps:
      - name: Log in to Docker Hub
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{secrets.DOCKER_PASSWORD}}"

      - name: Pull Docker Image
        run: docker pull spritegenix/cyber-sec-backend:latest # Fixed image name

      - name: Delete Old Container (if exists)
        run: docker rm -f myapp-container || true

      - name: Run Docker Container
        run: docker run -d -p 4000:4000 --name myapp-container spritegenix/cyber-sec-backend:latest # Fixed image name
