name: Build and Deploy Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Decode and Create .env File
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
        run: echo "$ENV_FILE_B64" | base64 --decode > .env

      - name: Build Docker Image
        env:
          IMAGE_NAME: spritegenix/cyber-sec-backend
        run: docker build -t $IMAGE_NAME:latest .

      - name: Run Docker Container for Testing
        env:
          IMAGE_NAME: spritegenix/cyber-sec-backend
        run: |
          docker run -d --name test-container -p 4000:4000 --env-file .env $IMAGE_NAME:latest
          sleep 10  # Give the app time to start
          docker logs test-container  # Check logs for issues

      - name: Check if Container is Running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' test-container)" != "true" ]; then
            echo "Container failed to start. Exiting..."
            exit 1
          fi

      - name: Stop and Remove Test Container
        run: docker stop test-container && docker rm test-container

      - name: Push Docker Image to Docker Hub (Only if Tests Pass)
        env:
          IMAGE_NAME: spritegenix/cyber-sec-backend
        run: docker push $IMAGE_NAME:latest

      - name: Cleanup .env File
        run: rm -f .env

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Decode and Create .env File on Server
        run: echo "${{ secrets.ENV_FILE_B64 }}" | base64 --decode > /home/ubuntu/cyber-sec-env/.env
      - name: Ensure Docker Permissions
        run: |
          sudo usermod -aG docker $USER
          newgrp docker

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Pull Docker Image
        env:
          IMAGE_NAME: spritegenix/cyber-sec-backend
        run: docker pull $IMAGE_NAME:latest

      - name: Stop and Remove Existing Container (if exists)
        run: |
          docker stop cyber-sec-backend || true
          docker rm -f cyber-sec-backend || true

      - name: Run Docker Container
        env:
          IMAGE_NAME: spritegenix/cyber-sec-backend
        run: |
          docker run -d \
            --name cyber-sec-backend \
            -p 4000:4000 \
            --restart unless-stopped \
            --env-file /home/ubuntu/cyber-sec-env/.env \
            $IMAGE_NAME:latest
